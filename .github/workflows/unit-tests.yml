name: unit-tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    defaults:
      run:
        working-directory: GeoSpoiler-RAG-Hybrid
        shell: pwsh

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - name: Ruff
        run: python -m ruff check . --config pyproject.toml

      - name: Prepare tokenizer cache
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/geospoiler-tokenizers
        run: python -c "import tiktoken; tiktoken.get_encoding('o200k_base'); tiktoken.get_encoding('cl100k_base')"

      - name: Full pytest without network
        env:
          TIKTOKEN_CACHE_DIR: ${{ runner.temp }}/geospoiler-tokenizers
        run: ./scripts/run_offline_tests.ps1 -Python python -RunRoot '${{ runner.temp }}/geospoiler-offline'
